name: Metrics

on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Custom CSS for Shadow Monarch & Blood Aura Palette
          config_style: |
            .header .name { color: #00d2d3 !important; }
            .field svg { fill: #6c5ce7 !important; }
            .activity { background: #0b0914 !important; }

          # Metrics Plugins
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_lines: yes
          plugin_isometric: yes
          plugin_isometric_satisfaction: 0.8
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_topics: yes
          plugin_topics_limit: 15
